name: Sentinel-1 Safety Evals

on:
  workflow_dispatch:
  push:
    paths:
      - "supabase/functions/sentinel-analyze/**"
      - "ai/evals/**"

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PheleCheck
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run Sentinel safety regression
        run: node ai/evals/sentinel_eval.mjs
