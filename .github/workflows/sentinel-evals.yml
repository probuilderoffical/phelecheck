name: Sentinel-1 Safety Evals

on:
  workflow_dispatch:

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PheleCheck
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Run live Sentinel safety regression
        run: node ai/evals/sentinel_eval.mjs
